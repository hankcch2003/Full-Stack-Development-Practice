<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 表格與卡片排版</title>

    <!-- 載入 Bootstrap 5 樣式 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <!-- 網站導覽列 -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">圖書管理系統</a>
        </div>
    </nav>

    <main class="container my-4">

        <h1 class="mb-4">圖書管理儀表板</h1>

        <!-- 統計卡片 -->
        <section class="row g-3 mb-4">

            <div class="col-12 col-md-4">
                <div class="card border-primary shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h6 text-secondary">圖書總數</h2>
                        <p id="totalBooks" class="display-6 fw-bold mb-0">5</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card border-success shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h6 text-secondary">圖書分類數</h2>
                        <p id="totalCategories" class="display-6 fw-bold mb-0">4</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card border-warning shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h6 text-secondary">最新出版年份</h2>
                        <p id="latestYear" class="display-6 fw-bold mb-0">2025</p>
                    </div>
                </div>
            </div>

        </section>

        <!-- 圖書表格 -->
        <section class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h2 class="h5 mb-0">圖書清單</h2>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">編號</th>
                                <th scope="col">圖書名稱</th>
                                <th scope="col">作者</th>
                                <th scope="col">分類</th>
                                <th scope="col">出版年份</th>
                                <th scope="col">操作</th>
                            </tr>
                        </thead>
                        <tbody id="bookTableBody">
                        </tbody>
                    </table>
                </div>

                <p id="emptyMessage" class="text-secondary d-none mb-0">
                    目前沒有圖書資料。
                </p>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button id="addBookButton" class="btn btn-primary" type="button">
                        新增範例圖書
                    </button>

                    <button id="resetButton" class="btn btn-outline-secondary" type="button">
                        還原範例資料
                    </button>
                </div>

                <div id="statusMessage" class="alert d-none mt-3 mb-0" role="status"></div>
            </div>
        </section>

    </main>

    <footer class="text-center text-secondary py-4">
        <small>圖書管理系統｜Bootstrap 表格與卡片練習</small>
    </footer>

    <script>
        // 建立範例圖書資料
        const initialBooks = [
            {
                id: 1,
                title: "C# 程式設計入門",
                author: "王小明",
                category: "程式設計",
                year: 2025
            },
            {
                id: 2,
                title: "SQL Server 資料庫實務",
                author: "陳小華",
                category: "資料庫",
                year: 2024
            },
            {
                id: 3,
                title: "HTML 與 CSS 網頁設計",
                author: "林小美",
                category: "網頁設計",
                year: 2023
            },
            {
                id: 4,
                title: "JavaScript 基礎教學",
                author: "張小安",
                category: "程式設計",
                year: 2025
            },
            {
                id: 5,
                title: "資料結構入門",
                author: "李小文",
                category: "程式設計",
                year: 2022
            }
        ];

        let books = initialBooks.map(function (book) {
            return { ...book };
        });

        const bookTableBody = document.querySelector("#bookTableBody");
        const totalBooks = document.querySelector("#totalBooks");
        const totalCategories = document.querySelector("#totalCategories");
        const latestYear = document.querySelector("#latestYear");
        const emptyMessage = document.querySelector("#emptyMessage");
        const statusMessage = document.querySelector("#statusMessage");
        const addBookButton = document.querySelector("#addBookButton");
        const resetButton = document.querySelector("#resetButton");

        // 顯示操作訊息
        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = "alert alert-" + type + " mt-3 mb-0";
        }

        // 建立單一表格儲存格
        function createCell(value) {
            const cell = document.createElement("td");
            cell.textContent = value;
            return cell;
        }

        // 更新表格內容
        function renderBooks() {
            bookTableBody.replaceChildren();

            books.forEach(function (book) {
                const row = document.createElement("tr");

                row.appendChild(createCell(book.id));
                row.appendChild(createCell(book.title));
                row.appendChild(createCell(book.author));
                row.appendChild(createCell(book.category));
                row.appendChild(createCell(book.year));

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.type = "button";
                deleteButton.className = "btn btn-sm btn-outline-danger";
                deleteButton.textContent = "刪除";
                deleteButton.dataset.bookId = book.id;

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                bookTableBody.appendChild(row);
            });

            updateStatistics();

            emptyMessage.classList.toggle("d-none", books.length > 0);
        }

        // 更新統計卡片
        function updateStatistics() {
            totalBooks.textContent = books.length;

            const categories = new Set(
                books.map(function (book) {
                    return book.category;
                })
            );

            totalCategories.textContent = categories.size;

            const years = books.map(function (book) {
                return book.year;
            });

            latestYear.textContent =
                years.length > 0 ? Math.max(...years) : "—";
        }

        // 新增一筆範例圖書
        addBookButton.addEventListener("click", function () {
            const nextId = books.length > 0
                ? Math.max(...books.map(function (book) {
                    return book.id;
                })) + 1
                : 1;

            const newBook = {
                id: nextId,
                title: "ASP.NET Core Web API 入門",
                author: "測試作者",
                category: "程式設計",
                year: 2026
            };

            books.push(newBook);

            renderBooks();
            showMessage("已新增範例圖書。", "success");
        });

        // 使用事件委派刪除圖書
        bookTableBody.addEventListener("click", function (event) {
            const deleteButton = event.target.closest("button[data-book-id]");

            if (!deleteButton || !bookTableBody.contains(deleteButton)) {
                return;
            }

            const bookId = Number(deleteButton.dataset.bookId);

            books = books.filter(function (book) {
                return book.id !== bookId;
            });

            renderBooks();
            showMessage("圖書已刪除。", "info");
        });

        // 還原原始範例資料
        resetButton.addEventListener("click", function () {
            books = initialBooks.map(function (book) {
                return { ...book };
            });

            renderBooks();
            showMessage("已還原範例資料。", "success");
        });

        // 初次載入時顯示圖書
        renderBooks();
    </script>

</body>
</html>
