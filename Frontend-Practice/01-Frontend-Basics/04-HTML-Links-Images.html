<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 設定文字編碼，避免繁體中文出現亂碼 -->
    <meta charset="UTF-8">

    <!-- 讓網頁能適應手機及電腦螢幕 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 設定瀏覽器分頁標題 -->
    <title>HTML 連結與圖片練習</title>
</head>
<body>
    <!-- id="top" 設定頁面上方的定位目標 -->
    <h1 id="top">HTML 連結與圖片練習</h1>

    <h2>一、一般網頁連結</h2>

    <!-- a 標籤用來建立超連結，href 指定目的地 -->
    <p>
        <a href="https://www.google.com/">前往 Google</a>
    </p>

    <p>
        <a href="https://developer.mozilla.org/zh-TW/docs/Web/HTML">
            閱讀 MDN HTML 教學
        </a>
    </p>

    <h2>二、在新分頁開啟網站</h2>

    <!-- target="_blank" 讓連結在新分頁開啟 -->
    <!-- rel="noopener noreferrer" 加強新分頁連結的安全性 -->
    <p>
        <a
            href="https://www.wikipedia.org/"
            target="_blank"
            rel="noopener noreferrer"
        >
            在新分頁開啟維基百科
        </a>
    </p>

    <h2>三、顯示書籍圖片</h2>

    <!-- img 標籤用來顯示圖片 -->
    <!-- src 是圖片來源，alt 是圖片的替代文字 -->
    <!-- width 設定圖片寬度，單位為像素 -->
    <img
        src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400"
        alt="一疊書籍的圖片"
        width="300"
    >

    <h2>四、點擊圖片開啟網站</h2>

    <!-- 將 img 放在 a 標籤內，就能點擊圖片開啟連結 -->
    <a
        href="https://www.books.com.tw/"
        target="_blank"
        rel="noopener noreferrer"
    >
        <img
            src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400"
            alt="點擊圖片前往博客來"
            width="200"
        >
    </a>

    <h2>五、回到頁面上方</h2>

    <!-- href="#top" 會跳到 id="top" 的元素 -->
    <p>
        <a href="#top">回到頁面上方</a>
    </p>

    <h2>六、練習重點</h2>

    <!-- ul 建立無序清單，li 代表清單中的項目 -->
    <ul>
        <li>使用 a 標籤建立網頁連結</li>
        <li>使用 href 設定連結目的地</li>
        <li>使用 target="_blank" 在新分頁開啟網站</li>
        <li>使用 img 標籤顯示圖片</li>
        <li>使用 src、alt 和 width 設定圖片</li>
        <li>使用 id 建立頁面內的定位目標</li>
    </ul>
</body>
</html>
