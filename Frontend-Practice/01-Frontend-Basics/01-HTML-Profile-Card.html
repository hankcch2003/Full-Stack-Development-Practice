<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 設定網頁文字編碼，避免繁體中文出現亂碼 -->
    <meta charset="UTF-8">

    <!-- 讓網頁在手機、平板及電腦上正確顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 設定瀏覽器分頁上顯示的標題 -->
    <title>個人資料卡</title>
</head>
<body>
    <!-- h1 是網頁的主要標題 -->
    <h1>個人資料卡</h1>

    <!-- h2 是第二層標題，用來區分不同內容 -->
    <h2>基本資料</h2>

    <!-- p 標籤用來顯示段落文字 -->
    <p>姓名：王小明</p>
    <p>職涯方向：初階全端工程師</p>
    <p>學習技術：C#、SQL Server、HTML、CSS、JavaScript</p>

    <h2>目前學習目標</h2>

    <!-- ul 建立無序清單，li 代表其中一個清單項目 -->
    <ul>
        <li>完成前端基礎練習</li>
        <li>開發書籍管理系統</li>
        <li>整理 GitHub 專案</li>
    </ul>

    <h2>學習資源</h2>

    <!-- a 標籤建立超連結，href 指定點擊後前往的網址 -->
    <p>
        <a href="https://developer.mozilla.org/zh-TW/docs/Web/HTML">
            查看 HTML 學習文件
        </a>
    </p>
</body>
</html>
