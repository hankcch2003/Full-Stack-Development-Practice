<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 表單與按鈕樣式</title>

    <!-- 載入 Bootstrap 5 樣式 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <!-- 網站導覽列 -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">圖書管理系統</a>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <section class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">新增圖書資料</h1>

                        <form id="bookForm" novalidate>
                            <!-- 圖書名稱 -->
                            <div class="mb-3">
                                <label for="bookTitle" class="form-label">
                                    圖書名稱
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="bookTitle"
                                    placeholder="例如：C# 程式設計入門"
                                    required
                                >
                                <div class="invalid-feedback">
                                    請輸入圖書名稱。
                                </div>
                            </div>

                            <!-- 作者 -->
                            <div class="mb-3">
                                <label for="bookAuthor" class="form-label">
                                    作者
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="bookAuthor"
                                    placeholder="請輸入作者姓名"
                                    required
                                >
                                <div class="invalid-feedback">
                                    請輸入作者姓名。
                                </div>
                            </div>

                            <!-- 圖書分類 -->
                            <div class="mb-3">
                                <label for="bookCategory" class="form-label">
                                    圖書分類
                                </label>
                                <select
                                    class="form-select"
                                    id="bookCategory"
                                    required
                                >
                                    <option value="">請選擇分類</option>
                                    <option value="程式設計">程式設計</option>
                                    <option value="資料庫">資料庫</option>
                                    <option value="網頁設計">網頁設計</option>
                                    <option value="其他">其他</option>
                                </select>
                                <div class="invalid-feedback">
                                    請選擇圖書分類。
                                </div>
                            </div>

                            <!-- 出版年份 -->
                            <div class="mb-3">
                                <label for="publishYear" class="form-label">
                                    出版年份
                                </label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="publishYear"
                                    placeholder="例如：2025"
                                    min="1900"
                                    max="2100"
                                    required
                                >
                                <div class="invalid-feedback">
                                    請輸入 1900 至 2100 之間的年份。
                                </div>
                            </div>

                            <!-- 表單按鈕 -->
                            <div class="d-flex flex-wrap gap-2 mt-4">
                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    新增圖書
                                </button>

                                <button
                                    type="reset"
                                    class="btn btn-outline-secondary"
                                >
                                    清除表單
                                </button>
                            </div>
                        </form>

                        <!-- 操作結果訊息 -->
                        <div
                            id="statusMessage"
                            class="alert d-none mt-4 mb-0"
                            role="status"
                            aria-live="polite"
                        ></div>
                    </div>
                </section>

                <!-- 本次新增的圖書 -->
                <section class="card shadow-sm mt-4">
                    <div class="card-body p-4">
                        <h2 class="h5 mb-3">本次新增的圖書</h2>

                        <p id="emptyMessage" class="text-secondary mb-0">
                            目前尚未新增圖書。
                        </p>

                        <ul id="bookList" class="list-group"></ul>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script>
        const bookForm = document.querySelector("#bookForm");
        const bookTitle = document.querySelector("#bookTitle");
        const bookAuthor = document.querySelector("#bookAuthor");
        const bookCategory = document.querySelector("#bookCategory");
        const publishYear = document.querySelector("#publishYear");
        const statusMessage = document.querySelector("#statusMessage");
        const bookList = document.querySelector("#bookList");
        const emptyMessage = document.querySelector("#emptyMessage");

        // 顯示操作結果
        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = "alert alert-" + type + " mt-4 mb-0";
        }

        // 更新圖書清單的空白提示
        function updateEmptyMessage() {
            emptyMessage.classList.toggle(
                "d-none",
                bookList.children.length > 0
            );
        }

        // 清除欄位驗證樣式
        function clearValidation() {
            bookForm.querySelectorAll(".is-invalid").forEach(function (field) {
                field.classList.remove("is-invalid");
            });
        }

        // 驗證表單資料
        function validateForm() {
            clearValidation();

            let isValid = true;

            if (bookTitle.value.trim() === "") {
                bookTitle.classList.add("is-invalid");
                isValid = false;
            }

            if (bookAuthor.value.trim() === "") {
                bookAuthor.classList.add("is-invalid");
                isValid = false;
            }

            if (bookCategory.value === "") {
                bookCategory.classList.add("is-invalid");
                isValid = false;
            }

            const year = Number(publishYear.value);

            if (
                publishYear.value.trim() === "" ||
                !Number.isInteger(year) ||
                year < 1900 ||
                year > 2100
            ) {
                publishYear.classList.add("is-invalid");
                isValid = false;
            }

            return isValid;
        }

        // 新增圖書
        bookForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!validateForm()) {
                showMessage("請檢查表單欄位，並修正錯誤資料。", "danger");
                return;
            }

            const title = bookTitle.value.trim();
            const author = bookAuthor.value.trim();
            const category = bookCategory.value;
            const year = publishYear.value;

            const listItem = document.createElement("li");
            listItem.className =
                "list-group-item d-flex justify-content-between align-items-start gap-3";

            const bookInfo = document.createElement("div");

            const titleElement = document.createElement("div");
            titleElement.className = "fw-bold";
            titleElement.textContent = title;

            const detailElement = document.createElement("div");
            detailElement.className = "text-secondary small";
            detailElement.textContent =
                author + "｜" + category + "｜" + year + " 年出版";

            bookInfo.appendChild(titleElement);
            bookInfo.appendChild(detailElement);

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "btn btn-sm btn-outline-danger";
            deleteButton.textContent = "刪除";

            listItem.appendChild(bookInfo);
            listItem.appendChild(deleteButton);

            bookList.appendChild(listItem);

            updateEmptyMessage();
            showMessage("圖書新增成功！", "success");

            bookForm.reset();
            clearValidation();
        });

        // 清除表單
        bookForm.addEventListener("reset", function () {
            clearValidation();
            statusMessage.className = "alert d-none mt-4 mb-0";
        });

        // 使用事件委派處理圖書刪除
        bookList.addEventListener("click", function (event) {
            const deleteButton = event.target.closest("button");

            if (
                !deleteButton ||
                !bookList.contains(deleteButton) ||
                !deleteButton.classList.contains("btn-outline-danger")
            ) {
                return;
            }

            const listItem = deleteButton.closest("li");

            if (listItem) {
                listItem.remove();
                updateEmptyMessage();
                showMessage("圖書已刪除。", "info");
            }
        });
    </script>

</body>
</html>
