<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Fetch API 圖書資料</title>

    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 16px;
            background-color: #f5f7fa;
        }

        .panel {
            padding: 24px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000012;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #0d6efd;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .secondary-button {
            background-color: #6c757d;
        }

        #status {
            padding: 12px;
            border-radius: 6px;
            background-color: #eef3f8;
        }

        .book-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .book-card {
            padding: 16px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .book-card h2 {
            font-size: 18px;
            margin-top: 0;
        }

        .book-card p {
            color: #555;
        }

        .error {
            color: #b02a37;
        }

        .empty {
            color: #666;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>
    <main class="panel">
        <h1>線上圖書資料查詢</h1>

        <p>
            使用 Fetch API 從公開測試 API 取得資料，
            練習非同步請求與 JSON 解析。
        </p>

        <div class="toolbar">
            <button id="loadButton">載入圖書資料</button>
            <button id="reloadButton" class="secondary-button">
                重新載入
            </button>
        </div>

        <p id="status" role="status" aria-live="polite">
            尚未載入資料
        </p>

        <section id="bookList" class="book-list" aria-label="圖書清單">
            <p class="empty">請點擊「載入圖書資料」。</p>
        </section>
    </main>

    <script>
        const loadButton = document.querySelector("#loadButton");
        const reloadButton = document.querySelector("#reloadButton");
        const status = document.querySelector("#status");
        const bookList = document.querySelector("#bookList");

        // 公開測試 API，回傳 JSON 格式的文章資料。
        const apiUrl = "https://jsonplaceholder.typicode.com/posts?_limit=10";

        async function loadBooks() {
            loadButton.disabled = true;
            reloadButton.disabled = true;

            status.classList.remove("error");
            status.textContent = "正在向 API 請求資料...";
            bookList.replaceChildren();

            try {
                // 發送 HTTP GET 請求。
                const response = await fetch(apiUrl);

                // HTTP 404、500 等錯誤不一定會讓 fetch 自動進入 catch。
                if (!response.ok) {
                    throw new Error(
                        `HTTP 請求失敗，狀態碼：${response.status}`
                    );
                }

                // 將回應本文解析成 JavaScript 陣列與物件。
                const posts = await response.json();

                if (!Array.isArray(posts) || posts.length === 0) {
                    status.textContent = "API 沒有回傳資料。";
                    bookList.innerHTML =
                        '<p class="empty">目前沒有資料。</p>';
                    return;
                }

                // 將 API 資料轉成圖書卡片。
                posts.forEach((post, index) => {
                    const card = document.createElement("article");
                    card.className = "book-card";

                    const title = document.createElement("h2");
                    title.textContent = post.title;

                    const author = document.createElement("p");
                    author.textContent = `資料編號：${post.id}`;

                    const description = document.createElement("p");
                    description.textContent =
                        post.body.length > 100
                            ? post.body.slice(0, 100) + "..."
                            : post.body;

                    card.append(title, author, description);
                    bookList.appendChild(card);
                });

                status.textContent =
                    `載入成功，共取得 ${posts.length} 筆資料。`;
            } catch (error) {
                status.classList.add("error");
                status.textContent =
                    "資料載入失敗：" + error.message;

                const message = document.createElement("p");
                message.className = "empty";
                message.textContent =
                    "請確認網路連線，或稍後再試。";

                bookList.replaceChildren(message);
            } finally {
                loadButton.disabled = false;
                reloadButton.disabled = false;
            }
        }

        loadButton.addEventListener("click", loadBooks);
        reloadButton.addEventListener("click", loadBooks);
    </script>
</body>
</html>
