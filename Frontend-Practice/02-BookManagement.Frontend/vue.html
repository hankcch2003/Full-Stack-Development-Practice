<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- 設定網頁字元編碼，避免中文亂碼 -->
    <meta charset="UTF-8">

    <!-- 讓網頁在手機、平板與電腦上正確調整版面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>書籍管理系統 | Vue 3</title>

    <!-- 載入 Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">
    <!-- 頁面上方導覽列 -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                書籍管理系統
            </span>
        </div>
    </nav>

    <!-- Vue 3 控制的主要內容區域 -->
    <main id="app" class="container py-4">
        <!-- 標題區域：不放置沒有功能的新增書籍按鈕 -->
        <div class="mb-4">
            <h1 class="h3 mb-1">書籍管理</h1>
            <p class="text-secondary mb-0">
                Book Management System · Vue 3
            </p>
        </div>

        <!-- 新增與修改書籍的表單卡片 -->
        <section class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0">{{ editingId === null ? "新增書籍" : "修改書籍" }}</h2>
            </div>

            <div class="card-body">
                <!-- 使用 Vue 綁定表單欄位與提交事件 -->
                <form @submit.prevent="saveBook">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="title" class="form-label">書名</label>
                            <input
                                id="title"
                                v-model.trim="form.title"
                                type="text"
                                class="form-control"
                                placeholder="請輸入書名"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label for="author" class="form-label">作者</label>
                            <input
                                id="author"
                                v-model.trim="form.author"
                                type="text"
                                class="form-control"
                                placeholder="請輸入作者"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label for="status" class="form-label">借閱狀態</label>
                            <select
                                id="status"
                                v-model.number="form.status"
                                class="form-select">
                                <option :value="0">可借閱</option>
                                <option :value="1">已借出</option>
                            </select>
                        </div>
                    </div>

                    <!-- 根據新增或修改模式切換按鈕文字 -->
                    <div class="mt-3">
                        <button
                            type="submit"
                            class="btn btn-success me-2"
                            :disabled="isSaving">
                            {{ isSaving ? "儲存中……" : (editingId === null ? "儲存書籍" : "儲存修改") }}
                        </button>

                        <!-- 修改模式才顯示取消修改按鈕 -->
                        <button
                            v-if="editingId !== null"
                            type="button"
                            class="btn btn-secondary"
                            @click="resetForm">
                            取消修改
                        </button>
                    </div>
                </form>

                <!-- 顯示新增、修改、刪除或載入的結果 -->
                <div
                    v-if="message"
                    class="alert mt-3 mb-0"
                    :class="messageType === 'error' ? 'alert-danger' : 'alert-success'"
                    role="alert">
                    {{ message }}
                </div>
            </div>
        </section>

        <!-- 書籍清單卡片 -->
        <section class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h2 class="h5 mb-0">書籍清單</h2>

                <!-- 重新載入後端資料 -->
                <button
                    type="button"
                    class="btn btn-sm btn-outline-primary"
                    @click="loadBooks"
                    :disabled="isLoading">
                    {{ isLoading ? "載入中……" : "重新載入" }}
                </button>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">編號</th>
                                <th scope="col">書名</th>
                                <th scope="col">作者</th>
                                <th scope="col">借閱狀態</th>
                                <th scope="col">操作</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- 顯示載入狀態 -->
                            <tr v-if="isLoading">
                                <td colspan="5" class="text-center text-secondary py-4">
                                    正在載入書籍資料……
                                </td>
                            </tr>

                            <!-- 顯示錯誤狀態 -->
                            <tr v-else-if="loadError">
                                <td colspan="5" class="text-center text-danger py-4">
                                    {{ loadError }}
                                </td>
                            </tr>

                            <!-- 沒有資料時顯示提示 -->
                            <tr v-else-if="books.length === 0">
                                <td colspan="5" class="text-center text-secondary py-4">
                                    目前沒有書籍資料
                                </td>
                            </tr>

                            <!-- 使用 v-for 顯示每一本書 -->
                            <tr
                                v-else
                                v-for="book in books"
                                :key="book.id">
                                <td>{{ book.id }}</td>
                                <td>{{ book.title }}</td>
                                <td>{{ book.author }}</td>
                                <td>
                                    <span
                                        class="badge"
                                        :class="Number(book.status) === 0 ? 'text-bg-success' : 'text-bg-warning'">
                                        {{ Number(book.status) === 0 ? "可借閱" : "已借出" }}
                                    </span>
                                </td>
                                <td>
                                    <button
                                        type="button"
                                        class="btn btn-sm btn-warning me-1"
                                        @click="editBook(book)">
                                        修改
                                    </button>

                                    <button
                                        type="button"
                                        class="btn btn-sm btn-danger"
                                        @click="deleteBook(book)"
                                        :disabled="deletingId === book.id">
                                        {{ deletingId === book.id ? "刪除中……" : "刪除" }}
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- 載入 API 網址設定 -->
    <script src="api.js"></script>

    <!-- 載入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <script>
        // 建立 Vue 3 應用程式
        const app = Vue.createApp({
            data() {
                return {
                    // 保存後端回傳的書籍清單
                    books: [],

                    // 保存表單目前輸入的資料
                    form: {
                        title: "",
                        author: "",
                        status: 0
                    },

                    // null 代表新增模式；有 ID 代表修改模式
                    editingId: null,

                    // 控制載入、儲存與刪除狀態
                    isLoading: false,
                    isSaving: false,
                    deletingId: null,

                    // 保存操作結果與錯誤訊息
                    message: "",
                    messageType: "success",
                    loadError: ""
                };
            },

            // Vue 元件載入後，自動讀取書籍資料
            mounted() {
                this.loadBooks();
            },

            methods: {
                // 從 HTTP 回應中取得可讀的錯誤訊息
                async getErrorMessage(response) {
                    const text = await response.text();

                    if (!text) {
                        return `HTTP ${response.status}：${response.statusText}`;
                    }

                    try {
                        const data = JSON.parse(text);

                        if (data.errors) {
                            return Object.values(data.errors).flat().join("\n");
                        }

                        return data.message || data.title || text;
                    } catch {
                        return text;
                    }
                },

                // 顯示成功或失敗訊息
                showMessage(message, type = "success") {
                    this.message = message;
                    this.messageType = type;
                },

                // 從 API 取得書籍清單
                async loadBooks() {
                    this.isLoading = true;
                    this.loadError = "";

                    try {
                        const response = await fetch(API_BASE_URL);

                        if (!response.ok) {
                            throw new Error(await this.getErrorMessage(response));
                        }

                        this.books = await response.json();
                    } catch (error) {
                        this.loadError = `載入失敗：${error.message}`;
                        console.error("載入書籍失敗：", error);
                    } finally {
                        this.isLoading = false;
                    }
                },

                // 清空表單並恢復新增模式
                resetForm() {
                    this.form = {
                        title: "",
                        author: "",
                        status: 0
                    };

                    this.editingId = null;
                    this.message = "";
                    this.messageType = "success";
                },

                // 將選取的書籍資料填回表單
                editBook(book) {
                    this.editingId = book.id;

                    this.form = {
                        title: book.title,
                        author: book.author,
                        status: Number(book.status)
                    };

                    this.showMessage("已載入書籍資料，修改後請按「儲存修改」。");

                    // 捲動到表單，方便使用者編輯
                    document.getElementById("title").scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                    document.getElementById("title").focus({
                        preventScroll: true
                    });
                },

                // 新增或修改書籍
                async saveBook() {
                    const title = this.form.title.trim();
                    const author = this.form.author.trim();

                    if (!title || !author) {
                        this.showMessage("請輸入書名與作者。", "error");
                        return;
                    }

                    const isEditing = this.editingId !== null;

                    const bookData = {
                        title: title,
                        author: author,
                        status: Number(this.form.status)
                    };

                    // 修改時將原有 ID 一併傳送
                    if (isEditing) {
                        bookData.id = this.editingId;
                    }

                    // 新增使用 POST；修改使用 PUT
                    const url = isEditing
                        ? `${API_BASE_URL}/${this.editingId}`
                        : API_BASE_URL;

                    const method = isEditing ? "PUT" : "POST";

                    this.isSaving = true;
                    this.message = "";

                    try {
                        const response = await fetch(url, {
                            method: method,
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(bookData)
                        });

                        if (!response.ok) {
                            throw new Error(await this.getErrorMessage(response));
                        }

                        // 先恢復表單，再重新載入清單
                        this.resetForm();
                        await this.loadBooks();

                        // 若重新載入失敗，不將整體操作誤報為完全成功
                        if (this.loadError) {
                            this.showMessage(
                                `書籍${isEditing ? "修改" : "新增"}成功，但重新載入清單失敗。${this.loadError}`,
                                "error"
                            );
                            return;
                        }

                        this.showMessage(
                            isEditing ? "書籍修改成功！" : "書籍新增成功！"
                        );
                    } catch (error) {
                        this.showMessage(`儲存失敗：${error.message}`, "error");
                        console.error("儲存書籍失敗：", error);
                    } finally {
                        this.isSaving = false;
                    }
                },

                // 刪除指定書籍
                async deleteBook(book) {
                    if (!confirm(`確定要刪除「${book.title}」嗎？`)) {
                        return;
                    }

                    this.deletingId = book.id;
                    this.message = "";

                    try {
                        const response = await fetch(`${API_BASE_URL}/${book.id}`, {
                            method: "DELETE"
                        });

                        if (!response.ok) {
                            throw new Error(await this.getErrorMessage(response));
                        }

                        // 若刪除的是目前正在修改的書籍，恢復新增模式
                        if (this.editingId === book.id) {
                            this.resetForm();
                        }

                        await this.loadBooks();

                        if (this.loadError) {
                            this.showMessage(
                                `書籍刪除成功，但重新載入清單失敗。${this.loadError}`,
                                "error"
                            );
                            return;
                        }

                        this.showMessage("書籍刪除成功！");
                    } catch (error) {
                        this.showMessage(`刪除失敗：${error.message}`, "error");
                        console.error("刪除書籍失敗：", error);
                    } finally {
                        this.deletingId = null;
                    }
                }
            }
        });

        // 將 Vue 應用程式掛載到 id="app" 的 HTML 元素
        app.mount("#app");
    </script>

    <!-- 載入 Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
