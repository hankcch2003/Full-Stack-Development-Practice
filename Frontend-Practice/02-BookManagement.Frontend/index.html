<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- 設定網頁字元編碼，避免中文亂碼 -->
    <meta charset="UTF-8">

    <!-- 讓網頁在手機、平板與電腦上正確調整版面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 設定瀏覽器分頁標題 -->
    <title>書籍管理系統 | Book Management System</title>

    <!-- 載入 Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 頁面上方導覽列 -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                書籍管理系統
            </span>
        </div>
    </nav>

    <!-- 網頁主要內容區域 -->
    <main class="container py-4">
        <!-- 標題區域：已移除沒有功能的右上角新增書籍按鈕 -->
        <div class="mb-4">
            <h1 class="h3 mb-1">書籍管理</h1>
            <p class="text-secondary mb-0">
                Book Management System
            </p>
        </div>

        <!-- 新增與修改書籍的表單卡片 -->
        <section class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0">新增書籍</h2>
            </div>

            <div class="card-body">
                <!-- 提交表單時由 JavaScript 呼叫 API -->
                <form id="bookForm">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="title" class="form-label">書名</label>
                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                placeholder="請輸入書名"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label for="author" class="form-label">作者</label>
                            <input
                                type="text"
                                class="form-control"
                                id="author"
                                placeholder="請輸入作者"
                                required>
                        </div>

                        <div class="col-md-3">
                            <label for="status" class="form-label">借閱狀態</label>
                            <select id="status" class="form-select">
                                <option value="0">可借閱</option>
                                <option value="1">已借出</option>
                            </select>
                        </div>
                    </div>

                    <!-- 新增或修改資料的主要提交按鈕 -->
                    <button type="submit" class="btn btn-success mt-3">
                        儲存書籍
                    </button>
                </form>
            </div>
        </section>

        <!-- 書籍清單卡片 -->
        <section class="card shadow-sm">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0">書籍清單</h2>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">編號</th>
                                <th scope="col">書名</th>
                                <th scope="col">作者</th>
                                <th scope="col">借閱狀態</th>
                                <th scope="col">操作</th>
                            </tr>
                        </thead>

                        <!-- JavaScript 會將 API 回傳的資料放入此處 -->
                        <tbody id="bookList">
                            <tr>
                                <td colspan="5" class="text-center text-secondary py-4">
                                    尚未載入書籍資料
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- 載入 API 網址設定 -->
    <script src="api.js"></script>

    <script>
        // 保存目前從後端取得的書籍清單
        let books = [];

        // 記錄正在修改的書籍 ID；null 表示新增模式
        let editingId = null;

        // 取得表單與畫面元素
        const bookForm = document.getElementById("bookForm");
        const bookList = document.getElementById("bookList");
        const formTitle = document.querySelector(".card-header h2");
        const submitButton = bookForm.querySelector('button[type="submit"]');

        // 顯示操作成功或失敗的訊息
        function showMessage(message) {
            alert(message);
        }

        // 讀取 API 回傳的錯誤訊息
        async function getErrorMessage(response) {
            const text = await response.text();

            if (!text) {
                return `HTTP ${response.status}：${response.statusText}`;
            }

            try {
                const data = JSON.parse(text);

                // 處理 ASP.NET Core 欄位驗證錯誤
                if (data.errors) {
                    return Object.values(data.errors).flat().join("\n");
                }

                return data.message || data.title || text;
            } catch {
                return text;
            }
        }

        // 向 API 取得書籍清單
        async function loadBooks() {
            bookList.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-4">
                        正在載入書籍資料……
                    </td>
                </tr>`;

            try {
                // 使用 GET 請求取得所有書籍
                const response = await fetch(API_BASE_URL);

                if (!response.ok) {
                    throw new Error(await getErrorMessage(response));
                }

                books = await response.json();
                renderBooks();
            } catch (error) {
                bookList.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-danger py-4">
                            載入失敗：${error.message}
                        </td>
                    </tr>`;

                console.error("載入書籍失敗：", error);
            }
        }

        // 將 books 陣列中的書籍資料呈現在表格中
        function renderBooks() {
            bookList.innerHTML = "";

            // 沒有書籍時顯示空清單訊息
            if (books.length === 0) {
                bookList.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-secondary py-4">
                            目前沒有書籍資料
                        </td>
                    </tr>`;
                return;
            }

            books.forEach(book => {
                const row = document.createElement("tr");

                // 將狀態數值轉換成文字與樣式
                const statusText = Number(book.status) === 0
                    ? "可借閱"
                    : "已借出";

                const statusClass = Number(book.status) === 0
                    ? "text-bg-success"
                    : "text-bg-warning";

                // 建立書籍資料列與操作按鈕
                row.innerHTML = `
                    <td>${book.id}</td>
                    <td></td>
                    <td></td>
                    <td>
                        <span class="badge ${statusClass}">${statusText}</span>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="btn btn-sm btn-warning me-1"
                            data-edit-id="${book.id}">
                            修改
                        </button>
                        <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            data-delete-id="${book.id}">
                            刪除
                        </button>
                    </td>`;

                // 將書名與作者當作純文字顯示
                row.cells[1].textContent = book.title;
                row.cells[2].textContent = book.author;

                bookList.appendChild(row);
            });
        }

        // 清空表單並恢復新增模式
        function resetForm() {
            bookForm.reset();
            editingId = null;

            formTitle.textContent = "新增書籍";
            submitButton.textContent = "儲存書籍";
        }

        // 處理新增與修改書籍
        bookForm.addEventListener("submit", async function (event) {
            // 阻止瀏覽器重新載入頁面
            event.preventDefault();

            const title = document.getElementById("title").value.trim();
            const author = document.getElementById("author").value.trim();
            const status = Number(document.getElementById("status").value);

            if (!title || !author) {
                showMessage("請輸入書名與作者。");
                return;
            }

            // 判斷目前是新增還是修改模式
            const isEditing = editingId !== null;

            const bookData = {
                title: title,
                author: author,
                status: status
            };

            if (isEditing) {
                bookData.id = editingId;
            }

            // 新增使用 POST；修改使用 PUT
            const url = isEditing
                ? `${API_BASE_URL}/${editingId}`
                : API_BASE_URL;

            const method = isEditing ? "PUT" : "POST";

            submitButton.disabled = true;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bookData)
                });

                if (!response.ok) {
                    throw new Error(await getErrorMessage(response));
                }

                // 成功後清空表單並重新載入資料
                resetForm();
                await loadBooks();

                showMessage(isEditing ? "書籍修改成功！" : "書籍新增成功！");
            } catch (error) {
                showMessage(`儲存失敗：${error.message}`);
                console.error("儲存書籍失敗：", error);
            } finally {
                submitButton.disabled = false;
            }
        });

        // 使用事件委派處理書籍清單中的修改與刪除
        bookList.addEventListener("click", async function (event) {
            const editButton = event.target.closest("[data-edit-id]");
            const deleteButton = event.target.closest("[data-delete-id]");

            // 修改書籍
            if (editButton) {
                const id = Number(editButton.dataset.editId);
                const book = books.find(item => item.id === id);

                if (!book) {
                    return;
                }

                editingId = id;

                // 將原有資料填回表單
                document.getElementById("title").value = book.title;
                document.getElementById("author").value = book.author;
                document.getElementById("status").value = String(book.status);

                formTitle.textContent = "修改書籍";
                submitButton.textContent = "儲存修改";

                // 捲動到表單，方便使用者編輯
                bookForm.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

                return;
            }

            // 刪除書籍
            if (deleteButton) {
                const id = Number(deleteButton.dataset.deleteId);

                if (!confirm("確定要刪除這本書嗎？")) {
                    return;
                }

                deleteButton.disabled = true;

                try {
                    const response = await fetch(`${API_BASE_URL}/${id}`, {
                        method: "DELETE"
                    });

                    if (!response.ok) {
                        throw new Error(await getErrorMessage(response));
                    }

                    // 若刪除的是正在修改的書籍，清空表單
                    if (editingId === id) {
                        resetForm();
                    }

                    await loadBooks();
                    showMessage("書籍刪除成功！");
                } catch (error) {
                    showMessage(`刪除失敗：${error.message}`);
                    console.error("刪除書籍失敗：", error);
                } finally {
                    deleteButton.disabled = false;
                }
            }
        });

        // 網頁開啟時，自動載入書籍清單
        loadBooks();
    </script>

    <!-- 載入 Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
